services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    networks:
      - app-network

  eureka:
    build:
      context: ./Eureka
      dockerfile: Dockerfile.dev
    ports:
      - '8761:8761'
    networks:
      - app-network

  api-gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile.dev
    ports:
      - "8888:8888"
    networks:
      - app-network
    depends_on:
      - eureka

  gamedata:
    build:
      context: ./GameData
      dockerfile: Dockerfile.dev
    networks:
      - app-network
    depends_on:
      - eureka

  discovery-worker:
    build:
      context: ./DiscoveryWorker
      dockerfile: Dockerfile.dev
    networks:
      - app-network
    depends_on:
      - eureka
      - diffbot-api

  detail-worker:
    build:
      context: ./DetailWorker
      dockerfile: Dockerfile.dev
    networks:
      - app-network
    depends_on:
      - eureka

  diffbot-api:
    build:
      context: ./DiffbotAPI
      dockerfile: Dockerfile.dev
    networks:
      - app-network
    depends_on:
      - eureka

  kafka:
    image: confluentinc/cp-kafka:latest
    networks:
      - app-network
    environment:
      CLUSTER_ID: 'IdILjb8pSgadtg2Huzaz0g'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - app-network
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
