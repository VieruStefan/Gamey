global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8888'
          - 'gamedata:8080'
          - 'discovery-worker:8080'
          - 'detail-worker:8080'
          - 'diffbot-api:8080'
          - 'eureka-peer1:8761'
          - 'eureka-peer2:8762'