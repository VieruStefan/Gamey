global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8888'
          - 'gamedata:8090'
          - 'discovery-worker:8091'
          - 'detail-worker:8092'
          - 'diffbot-api:8095'
          - 'eureka-peer1:8761'
          - 'eureka-peer2:8762'
  - job_name: 'mongodb'
    static_configs:
      - targets:
          - 'mongodb-exporter:9216'