server:
  port: 8092

spring:
  application:
    name: worker.detail
  kafka:
    bootstrap-servers: PLAINTEXT://kafka:9092
    consumer:
      group-id: website-scraping
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    mongodb:
      uri: mongodb://root:root@mongodb:27017/gamey?authSource=admin
eureka:
  client:
    service-url:
      defaultZone: http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    enabled: true
logging:
  level:
    org.dis.worker.detail.*: debug
