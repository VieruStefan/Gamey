server:
  port: 8888
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: master
              uri: http://localhost:8090
              predicates:
                - Path=/api/diffbot/**
            - id: reducer
              uri: http://localhost:8092
              predicates:
                - Path=/sse/**
          httpclient:
            wiretap: true
          httpserver:
            wiretap: true
logging:
  level:
    web: trace
    reactor.netty.http.client: info
    reactor.netty.http.server: info