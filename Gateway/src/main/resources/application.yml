server:
  port: 8888
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            response-timeout: 0
            connect-timeout: 5000
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
          routes:
            - id: discovery
              uri: lb://discovery-worker:8091
              predicates:
                - Path=/discovery/**
              filters:
                - StripPrefix=1
            - id: details
              uri: lb://details-worker:8092
              predicates:
                - Path=/details/**
              filters:
                - StripPrefix=1
            - id: aggregator
              uri: lb://aggregator:8093
              predicates:
                - Path=/aggregator/**
              filters:
                - StripPrefix=1
  data:
    mongodb:
      uri: mongodb://root:root@mongodb:27017/gamey?authSource=admin
  kafka:
    bootstrap-servers: PLAINTEXT://kafka:9092

logging:
  level:
    web: trace
    reactor.netty.http.client: info
    reactor.netty.http.server: info

